name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "Sources/BuildWatch/LogClassifier.swift", "fixtures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/fixtures
          cp site/index.html site/og.png site/robots.txt site/sitemap.xml _site/
          cp fixtures/*.log _site/fixtures/
          python3 - <<'PY'
          import json, re
          s = open("Sources/BuildWatch/LogClassifier.swift").read()
          pat = re.compile(r'Rule\(\s*kind: \.(\w+),\s*pattern: #"(.*?)"#,\s*summary: "((?:[^"\\]|\\.)*)",\s*action: "((?:[^"\\]|\\.)*)",\s*confidence: ([0-9.]+)\s*\)', re.S)
          snake = lambda k: re.sub(r"([A-Z])", lambda m: "_" + m.group(1).lower(), k)
          rules = [{"kind": snake(m[0]), "pattern": m[1], "summary": m[2], "action": m[3], "confidence": float(m[4])} for m in pat.findall(s)]
          assert len(rules) == s.count("Rule(\n            kind:"), "rule count mismatch"
          json.dump(rules, open("_site/rules.json", "w"))
          print(len(rules), "rules")
          PY
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
