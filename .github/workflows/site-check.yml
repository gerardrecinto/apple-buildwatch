name: Browser demo QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    name: Site QA (${{ matrix.browser }}, 375px and 1440px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Check dependencies
        run: npm audit --audit-level=moderate
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check real rules, samples, recovery, keyboard, contrast, and reduced motion
        run: npm run build:site && npx playwright test --project=${{ matrix.browser }}-375 --project=${{ matrix.browser }}-1440
      - name: Keep failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
