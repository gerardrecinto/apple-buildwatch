name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build macOS binary
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          raw="$RAW_VERSION"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Check release packaging and verified installation
        run: python3 -m unittest discover -s scripts -p 'test_release_install.py' -v

      - name: Package binary and checksums
        run: scripts/package-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            buildwatch-macos.zip
            SHA256SUMS
